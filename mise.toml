[tools]
node = "22"

[tasks.install]
description = "Install npm dependencies"
run = "npm install"
sources = ["package.json", "package-lock.json"]
outputs = ["node_modules/.package-lock.json"]

[tasks.dev]
description = "Start local dev server with live reload (http://localhost:4321)"
depends = ["install"]
run = "npm run dev"

[tasks.build]
description = "Build static site to dist/"
depends = ["install"]
run = "npm run build"

[tasks.preview]
description = "Preview the production build locally (http://localhost:4321)"
depends = ["install"]
run = "npm run preview"
